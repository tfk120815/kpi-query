<title>KPI绩效分析报告</title>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a3a5c,#2d5f8a);color:#fff;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:24px;font-weight:600}
.header .sub{font-size:13px;opacity:.8;margin-top:6px}
.logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer}
.container{max-width:1280px;margin:0 auto;padding:20px}
.tabs{display:flex;background:#fff;border-radius:8px 8px 0 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab{flex:1;padding:14px 20px;text-align:center;cursor:pointer;font-size:14px;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;background:#fafafa;color:#666}
.tab:hover{background:#f0f0f0}
.tab.active{background:#fff;color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:600}
.content{background:#fff;border-radius:0 0 8px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px;min-height:400px}
.panel{display:none}
.panel.active{display:block}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#f8f9fb;border-radius:8px;padding:16px;text-align:center}
.stat-card .label{font-size:12px;color:#999;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700;color:#1a3a5c}
.stat-card .value.green{color:#2e7d32}
.stat-card .value.red{color:#c62828}
.chart-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.chart-box{flex:1;min-width:360px;height:400px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a3a5c;color:#fff;padding:10px 8px;text-align:center;font-weight:500;white-space:nowrap}
td{padding:8px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}
tr:hover td{background:#f5f8fc}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500}
.badge.green{background:#e8f5e9;color:#2e7d32}
.badge.red{background:#ffebee;color:#c62828}
.badge.blue{background:#e3f2fd;color:#1565c0}
.improvement-card{background:#fff8f8;border-left:4px solid #c62828;border-radius:6px;padding:16px 20px;margin-bottom:12px}
.improvement-card .title{font-weight:600;font-size:15px;color:#c62828;margin-bottom:6px}
.improvement-card .detail{font-size:13px;color:#666;line-height:1.8}
.section-title{font-size:16px;font-weight:600;color:#1a3a5c;margin:20px 0 12px;padding-bottom:8px;border-bottom:2px solid #1a3a5c;display:inline-block}
.empty{text-align:center;padding:40px;color:#999;font-size:14px}
.l2-table{max-height:320px;overflow-y:auto}
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 120px)}
.auth-card{background:#fff;border-radius:16px;padding:40px;width:400px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-card h2{text-align:center;font-size:20px;color:#1a3a5c;margin-bottom:24px}
.auth-card .fg{margin-bottom:16px}
.auth-card label{display:block;font-size:13px;color:#888;margin-bottom:6px}
.auth-card input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.auth-card input:focus{border-color:#2d5f8a}
.auth-card .btn{width:100%;padding:12px;background:linear-gradient(135deg,#1a3a5c,#2d5f8a);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.auth-card .error{color:#c62828;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.auth-card .success{color:#2e7d32;font-size:13px;text-align:center;margin-top:12px}
.auth-card .sw{text-align:center;margin-top:16px;font-size:13px;color:#888}
.auth-card .sw a{color:#2d5f8a;cursor:pointer;font-weight:600}
.loading{text-align:center;padding:60px 20px;color:#999}
.loading .sp{display:inline-block;width:32px;height:32px;border:3px solid #eee;border-top-color:#2d5f8a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#fff3f3;border:1px solid #ffcdd2;border-radius:8px;padding:20px;color:#c62828;font-size:14px;word-break:break-all}
@media(max-width:768px){.chart-row{flex-direction:column}.chart-box{min-width:100%}.stat-cards{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 20px}}
</style>

async function doReg(){
  var e=$('rId').value.trim(),n=$('rNm').value.trim(),p=$('rPwd').value,er=$('rErr');er.textContent='';er.className='error';
  if(!e||!n||!p){er.textContent='\u8bf7\u586b\u5199\u6240\u6709\u5b57\u6bb5';return}
  if(p.length<6){er.textContent='\u5bc6\u7801\u81f3\u5c116\u4f4d';return}
  try{var r=await sb.rpc('check_employee',{eid:e,ename:n});if(r.error||!r.data){er.textContent='\u5de5\u53f7\u6216\u59d3\u540d\u4e0e\u7cfb\u7edf\u4e0d\u5339\u914d';return}
  var r2=await sb.auth.signUp({email:e+'@kpi.local',password:p,options:{data:{emp_id:e,emp_name:n}}});
  if(r2.error){var m=r2.error.message;er.textContent=m.indexOf('already')!==-1||m.indexOf('Database')!==-1?'\u8be5\u5de5\u53f7\u5df2\u6ce8\u518c\uff0c\u8bf7\u767b\u5f55':'\u6ce8\u518c\u5931\u8d25';return}
  er.className='success';er.textContent='\u6ce8\u518c\u6210\u529f\uff01\u8bf7\u767b\u5f55'}catch(x){er.textContent='\u6ce8\u518c\u5931\u8d25'}
}

async function doLogin(){
  var e=$('lId').value.trim(),p=$('lPwd').value,er=$('lErr');er.textContent='';
  if(!e||!p){er.textContent='\u8bf7\u8f93\u5165\u5de5\u53f7\u548c\u5bc6\u7801';return}
  try{var r=await sb.auth.signInWithPassword({email:e+'@kpi.local',password:p});if(r.error){er.textContent='\u5de5\u53f7\u6216\u5bc6\u7801\u9519\u8bef';return}
  await loadApp()}catch(x){er.textContent='\u767b\u5f55\u5931\u8d25'}
}

async function doLogout(){await sb.auth.signOut();showAuth()}

async function loadApp(){
  $('page').innerHTML='<div class="loading"><div class="sp"></div><div>\u52a0\u8f7dKPI\u6570\u636e...</div></div>';
  try{
    // Step 1: profile
    var r1=await sb.from('profiles').select('*').single();
    if(!r1.data||r1.error){showErr('\u67e5\u8be2\u6863\u6848\u5931\u8d25: '+JSON.stringify(r1.error));return}
    var prof=r1.data;

    // Step 2: my KPI
    var r2=await sb.from('kpi_data').select('*').single();
    if(!r2.data||r2.error){showErr('\u67e5\u8be2KPI\u5931\u8d25: '+JSON.stringify(r2.error));return}

    // Step 3: team stats
    var r3=await sb.rpc('get_team_stats');
    var ts=r3.data||null;

    // Convert
    myEmp=convertData(r2.data,prof,ts);
    renderApp(myEmp,ts);
  }catch(x){showErr('\u52a0\u8f7d\u5f02\u5e38: '+x.message)}
}

function convertData(d,prof,ts){
  var keys=Object.keys(d),cols=keys.filter(function(k){return k!=='id'&&k!=='created_at'});
  var emp={name:d[cols[1]]||'-',star:d[cols[2]]||'-',dept:d[cols[3]]||'-',branch:d[cols[4]]||'-',total:0,totalRank:1,l1Scores:{},l2Scores:{},l2ToL1:{},advantages:[],weaknesses:[]};

  // Find KPI total (max numeric value)
  var maxVal=0;
  cols.forEach(function(k,i){if(i<5)return;var v=d[k];if(typeof v==='number'&&v!==null&&k.indexOf('\u56e2\u961f')===-1&&k.indexOf('\u6807\u51c6\u5dee')===-1&&k.indexOf('\u6700\u9ad8\u5206')===-1){if(v>maxVal){maxVal=v;emp.total=v}}});

  // Find rank
  cols.forEach(function(k){var v=d[k];if(typeof v==='number'&&v>=1&&v<=37&&v===Math.floor(v))emp.totalRank=v});

  // Map l1 scores using known column names
  var l1Map={'\u79ef\u5206_\u5f97\u5206':'\u79ef\u5206','\u91cd\u70b9\u4e1a\u52a1_\u5f97\u5206':'\u91cd\u70b9\u4e1a\u52a1','\u89c4\u5b9a\u52a8\u4f5c_\u5f97\u5206':'\u89c4\u5b9a\u52a8\u4f5c','\u52a0\u6263\u5206\u9879_\u5f97\u5206':'\u52a0\u6263\u5206\u9879','\u5206\u5c40\u957f\u6253\u5206_\u5f97\u5206':'\u5206\u5c40\u957f\u6253\u5206'};
  cols.forEach(function(k){if(l1Map[k])emp.l1Scores[l1Map[k]]=d[k]});

  // Also try direct match with L1 names from static data
  STATIC_L1NAMES.forEach(function(n){if(emp.l1Scores[n]===undefined){var k=n+'_\u5f97\u5206';if(d[k]!==undefined)emp.l1Scores[n]=d[k]}});

  // L2 scores - remaining numeric cols that are not l1 or team stats
  var skipCols=['id','created_at',cols[0],cols[1],cols[2],cols[3],cols[4]];
  STATIC_L1NAMES.forEach(function(n){skipCols.push(n+'_\u5f97\u5206')});
  cols.forEach(function(k){
    if(skipCols.indexOf(k)!==-1)return;
    var v=d[k];if(v===null||v===undefined)return;
    if(typeof v==='number'){
      if(k.indexOf('\u56e2\u961f')!==-1||k.indexOf('\u6807\u51c6\u5dee')!==-1||k.indexOf('\u6700\u9ad8\u5206')!==-1)return;
      var clean=k.replace('_\u5f97\u5206','');
      emp.l2Scores[clean]=v;
      // Guess parent
      var l1='\u5176\u4ed6';
      if(k.indexOf('\u79ef\u5206')!==-1)l1='\u79ef\u5206';
      else if(k.indexOf('FTTR')!==-1||k.indexOf('\u5bbd\u5e26')!==-1||k.indexOf('\u4e24\u7ebf')!==-1||k.indexOf('\u89c6\u8054')!==-1||k.indexOf('\u9152\u7f8e')!==-1)l1='\u91cd\u70b9\u4e1a\u52a1';
      else if(k.indexOf('\u62dc\u8bbf')!==-1||k.indexOf('\u7ef4\u7cfb')!==-1||k.indexOf('ICT')!==-1||k.indexOf('\u7535\u8111')!==-1||k.indexOf('\u5c0f\u5fae')!==-1)l1='\u89c4\u5b9a\u52a8\u4f5c';
      else if(k.indexOf('\u5b89\u5168')!==-1||k.indexOf('\u6295\u8bc9')!==-1||k.indexOf('\u9501\u5b58')!==-1||k.indexOf('\u7eed\u7b7e')!==-1||k.indexOf('\u667a\u6295')!==-1||k.indexOf('\u91cf\u5b50')!==-1)l1='\u52a0\u6263\u5206\u9879';
      emp.l2ToL1[clean]=l1;
    }
  });

  // Advantages / weaknesses from array columns
  cols.forEach(function(k){if(Array.isArray(d[k])&&d[k].length>0){if(emp.advantages.length===0)emp.advantages=d[k];else if(emp.weaknesses.length===0)emp.weaknesses=d[k]}});

  return emp;
}

function renderApp(emp,ts){
  var hdr='<div class="header"><div><h1>KPI\u7ee9\u6548\u5206\u6790\u62a5\u544a - 3\u6708</h1><div class="sub">'+emp.name+' ('+emp.dept+' '+emp.star+')</div></div><div><button class="logout-btn" onclick="doLogout()">\u9000\u51fa\u767b\u5f55</button></div></div>';

  var body='<div class="container"><div class="tabs">';
  body+='<div class="tab active" data-tab="personal" onclick="swTab(this)">\u4e2a\u4eba\u5206\u6790</div>';
  body+='<div class="tab" data-tab="team" onclick="swTab(this)">\u6392\u540d\u4e0e\u7edf\u8ba1</div>';
  body+='<div class="tab" data-tab="improve" onclick="swTab(this)">\u6539\u8fdb\u8ba1\u5212</div>';
  body+='<div class="tab" data-tab="model" onclick="swTab(this)">\u6a21\u578b\u6982\u89c8</div>';
  body+='</div><div class="content">';

  body+='<div class="panel active" id="p-personal"><div class="stat-cards" id="pStats"></div><div class="chart-row"><div class="chart-box" id="radarChart"></div><div class="chart-box" id="barChart"></div></div><div class="section-title">\u5404\u7ef4\u5ea6\u5f97\u5206\u8be6\u60c5</div><table id="pTable"></table><div class="section-title" style="margin-top:20px">\u4e8c\u7ea7\u6307\u6807\u660e\u7ec6</div><div class="l2-table"><table id="l2Table"></table></div></div>';
  body+='<div class="panel" id="p-team"><div class="stat-cards" id="tStats"></div><div id="rankCard"></div></div>';
  body+='<div class="panel" id="p-improve"><div id="improveList"></div></div>';
  body+='<div class="panel" id="p-model"><div class="section-title">KPI\u6307\u6807\u4f53\u7cfb\uff08100\u5206\u5c01\u9876\uff0c\u52a0\u6263\u5206\u9879\u53e6\u8ba1\uff09</div><table id="mTable"></table></div>';

  body+='</div></div>';
  $('page').innerHTML=hdr+body;

  // Init
  initCharts(emp,ts);
  renderPersonal(emp,ts);
  renderModel();
}

function swTab(el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('p-'+el.dataset.tab).classList.add('active');
}

var rc,bc;
function initCharts(){rc=echarts.init($('radarChart'));bc=echarts.init($('barChart'));window.addEventListener('resize',function(){rc.resize();bc.resize()})}

function renderPersonal(emp,ts){
  $('pStats').innerHTML='<div class="stat-card"><div class="label">KPI\u603b\u5206</div><div class="value">'+emp.total.toFixed(2)+'</div></div><div class="stat-card"><div class="label">\u6392\u540d</div><div class="value">'+emp.totalRank+'/'+(ts?ts.totalCount:STATIC_TOTALCOUNT)+'</div></div><div class="stat-card"><div class="label">\u661f\u7ea7</div><div class="value" style="font-size:18px">'+emp.star+'</div></div><div class="stat-card"><div class="label">\u4f18\u52bf\u9879</div><div class="value green">'+emp.advantages.length+'</div></div><div class="stat-card"><div class="label">\u77ed\u677f\u9879</div><div class="value red">'+emp.weaknesses.length+'</div></div>';

  // Radar
  var basicL1=STATIC_L1NAMES.filter(function(n){return n!=='\u52a0\u6263\u5206\u9879'});
  var indicator=basicL1.map(function(n){return{name:n,max:STATIC_L1MAX[n]||100}});
  var myVals=basicL1.map(function(n){return emp.l1Scores[n]||0});
  var avgVals=basicL1.map(function(n){return ts&&ts.l1TeamStats&&ts.l1TeamStats[n]?ts.l1TeamStats[n].avg:(STATIC_L1STATS[n]?STATIC_L1STATS[n].avg:0)});

  rc.setOption({title:{text:emp.name+' \u96f7\u8fbe\u56fe',left:'center',textStyle:{fontSize:14}},tooltip:{},legend:{data:['\u4e2a\u4eba\u5f97\u5206','\u56e2\u961f\u5747\u503c'],bottom:0},radar:{indicator:indicator,shape:'polygon',splitNumber:5},series:[{type:'radar',data:[{value:myVals,name:'\u4e2a\u4eba\u5f97\u5206',lineStyle:{color:'#1a3a5c'},areaStyle:{color:'rgba(26,58,92,0.15)'},itemStyle:{color:'#1a3a5c'}},{value:avgVals,name:'\u56e2\u961f\u5747\u503c',lineStyle:{color:'#999',type:'dashed'},areaStyle:{color:'rgba(153,153,153,0.05)'},itemStyle:{color:'#999'}}]}]},true);

  // Bar - deviation
  var diffData=STATIC_L1NAMES.map(function(n){return{name:n,value:parseFloat(((emp.l1Scores[n]||0)-(ts&&ts.l1TeamStats&&ts.l1TeamStats[n]?ts.l1TeamStats[n].avg:(STATIC_L1STATS[n]?STATIC_L1STATS[n].avg:0))).toFixed(2))}});
  bc.setOption({title:{text:emp.name+' \u4e0e\u56e2\u961f\u5747\u503c\u504f\u5dee',left:'center',textStyle:{fontSize:14}},tooltip:{trigger:'axis'},xAxis:{type:'category',data:STATIC_L1NAMES,axisLabel:{rotate:20,fontSize:11}},yAxis:{type:'value',name:'\u504f\u5dee'},series:[{type:'bar',data:diffData.map(function(d){return{value:d.value,itemStyle:{color:d.value>=0?'#2e7d32':'#c62828'}}}),label:{show:true,position:'top',formatter:'{c}',fontSize:11}}]},true);

  // L1 table
  var h='<thead><tr><th>\u4e00\u7ea7\u6307\u6807</th><th>\u6ee1\u5206</th><th>\u5f97\u5206</th><th>\u56e2\u961f\u5747\u503c</th><th>\u504f\u5dee</th><th>\u5224\u5b9a</th></tr></thead><tbody>';
  STATIC_L1NAMES.forEach(function(n){
    var s=emp.l1Scores[n]||0;var a=ts&&ts.l1TeamStats&&ts.l1TeamStats[n]?ts.l1TeamStats[n].avg:(STATIC_L1STATS[n]?STATIC_L1STATS[n].avg:0);
    var df=(s-a).toFixed(2);var j='\u8fbe\u6807',b='blue';
    if(emp.advantages.indexOf(n)!==-1){j='\u4f18\u52bf';b='green'}else if(emp.weaknesses.indexOf(n)!==-1){j='\u77ed\u677f';b='red'}
    h+='<tr><td>'+n+'</td><td>'+(STATIC_L1MAX[n]||'-')+'</td><td>'+s+'</td><td>'+a+'</td><td>'+df+'</td><td><span class="badge '+b+'">'+j+'</span></td></tr>';
  });
  h+='</tbody>';$('pTable').innerHTML=h;

  // L2 table
  var entries=Object.entries(emp.l2Scores);
  h='<thead><tr><th>\u4e8c\u7ea7\u6307\u6807</th><th>\u5f97\u5206</th><th>\u6240\u5c5e\u4e00\u7ea7</th></tr></thead><tbody>';
  entries.forEach(function(e){h+='<tr><td>'+e[0]+'</td><td>'+e[1]+'</td><td>'+(emp.l2ToL1[e[0]]||'-')+'</td></tr>'});
  h+='</tbody>';$('l2Table').innerHTML=h;

  // Team stats
  if(ts&&ts.totalCount){
    $('tStats').innerHTML='<div class="stat-card"><div class="label">\u4f60\u7684\u6392\u540d</div><div class="value">'+emp.totalRank+'</div></div><div class="stat-card"><div class="label">\u56e2\u961f\u4eba\u6570</div><div class="value">'+ts.totalCount+'</div></div><div class="stat-card"><div class="label">\u56e2\u961f\u5747\u5206</div><div class="value">'+ts.teamAvg+'</div></div><div class="stat-card"><div class="label">\u4f60\u7684\u5f97\u5206</div><div class="value">'+emp.total.toFixed(2)+'</div></div>';
    var pct=em.totalRank<=Math.floor(ts.totalCount*0.2)?'\u524d20%':emp.totalRank>Math.floor(ts.totalCount*0.8)?'\u540e20%':'\u4e2d\u6bb5';
    $('rankCard').innerHTML='<div style="margin-top:24px;padding:24px;background:linear-gradient(135deg,#1a3a5c,#2d5f8a);border-radius:12px;color:#fff;text-align:center"><div style="font-size:13px;opacity:.8">\u4f60\u7684KPI\u6392\u540d</div><div style="font-size:64px;font-weight:800;margin:12px 0">'+emp.totalRank+'</div><div style="font-size:16px;opacity:.8">/ '+ts.totalCount+' \u4eba</div></div>';
  }

  // Improve
  var ih='';
  if(emp.weaknesses.length===0){ih='<div class="empty">\u6682\u65e0\u77ed\u677f\u9879\uff0c\u8868\u73b0\u4f18\u79c0\uff01</div>'}
  else{emp.weaknesses.forEach(function(w){var s=emp.l1Scores[w]||0;var a=ts&&ts.l1TeamStats&&ts.l1TeamStats[w]?ts.l1TeamStats[w].avg:(STATIC_L1STATS[w]?STATIC_L1STATS[w].avg:0);
    ih+='<div class="improvement-card"><div class="title">\u77ed\u677f\u9879\uff1a'+w+'</div><div class="detail">\u5f53\u524d\u5f97\u5206\uff1a<strong>'+s+'</strong> | \u56e2\u961f\u5747\u503c\uff1a'+a+' | \u5dee\u8ddd\uff1a'+(s-a).toFixed(2)+'</div></div>'})}
  ih+='<div style="margin-top:24px;padding:20px;background:#e8f5e9;border-radius:8px"><div style="font-weight:600;color:#2e7d32;margin-bottom:8px">\u6539\u8fdb\u5efa\u8bae</div><div style="font-size:13px;color:#333;line-height:1.8">\u62c6\u89e3\u76ee\u6807\u3001\u4f18\u5316\u5ba2\u6237\u7ed3\u6784\u3001\u63d0\u5347\u8f6c\u5316\u7387\u3001\u51cf\u5c11\u5ba2\u6237\u6d41\u5931\u3002<br>\u91cd\u70b9\u5173\u6ce8\u5f97\u5206\u4f4e\u4e8e\u56e2\u961f\u5e73\u5747\u503c\u7684\u7ef4\u5ea6\uff0c\u5236\u5b9a\u9488\u5bf9\u6027\u63d0\u5347\u8ba1\u5212\u3002</div></div>';
  $('improveList').innerHTML=ih;
}

function renderModel(){
  var h='<thead><tr><th>\u4e00\u7ea7\u6307\u6807</th><th>\u4e8c\u7ea7\u6307\u6807</th><th>\u4e8c\u7ea7\u6743\u91cd(%)</th><th>\u6ee1\u5206</th><th>\u8bc4\u5206\u6807\u51c6</th></tr></thead><tbody>';
  STATIC_MODEL.forEach(function(r){var mx=r.maxScore===-999?'\u4e0d\u5c01\u9876(\u6263\u5206)':r.maxScore;h+='<tr><td>'+r.l1+'</td><td>'+r.l2+'</td><td>'+r.weight+'</td><td>'+mx+'</td><td style="text-align:left;white-space:normal;max-width:300px">'+r.scoringRule+'</td></tr>'});
  h+='</tbody>';$('mTable').innerHTML=h;
}
