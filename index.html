<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI薪酬查询系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:#fff}
.container{max-width:800px;margin:0 auto;padding:20px}
.header{text-align:center;padding:30px 0 20px}
.header h1{font-size:24px;font-weight:600;margin-bottom:8px}
.header p{color:#8892b0;font-size:14px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:30px;margin-bottom:20px}
.auth-form{max-width:400px;margin:0 auto}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:14px;color:#8892b0;margin-bottom:8px}
.form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:border-color .3s}
.form-group input:focus{border-color:#4fc3f7}
.form-group input::placeholder{color:#5a6380}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4fc3f7,#0288d1);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,195,247,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;min-height:20px}
.success{color:#66bb6a;font-size:13px;text-align:center;margin-top:10px}
.auth-tabs,.tabs{display:flex;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden;margin-bottom:20px}
.auth-tab,.tab{flex:1;padding:12px 10px;text-align:center;cursor:pointer;font-size:14px;border:none;background:0 0;color:#8892b0;transition:background .3s}
.auth-tab.active,.tab.active{background:rgba(79,195,247,.2);color:#4fc3f7;font-weight:600}
.kpi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.kpi-name{font-size:22px;font-weight:700}
.kpi-badge{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:13px}
.kpi-score{text-align:center;padding:24px 0}
.kpi-score .number{font-size:56px;font-weight:800;background:linear-gradient(135deg,#4fc3f7,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kpi-score .label{font-size:14px;color:#8892b0;margin-top:4px}
.kpi-score .sub{font-size:13px;color:#5a6380;margin-top:8px}
.section{margin-bottom:24px}
.section-title{font-size:15px;font-weight:600;color:#4fc3f7;margin-bottom:12px}
.scores-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.score-item{background:rgba(255,255,255,.05);border-radius:10px;padding:16px}
.score-item .name{font-size:13px;color:#8892b0;margin-bottom:6px}
.score-item .value{font-size:20px;font-weight:700}
.tag-row{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:6px 14px;border-radius:20px;font-size:13px}
.tag-green{background:rgba(76,175,80,.2);color:#66bb6a}
.tag-red{background:rgba(244,67,54,.2);color:#ef5350}
.detail-table{width:100%;font-size:13px;border-collapse:collapse}
.detail-table th{text-align:left;color:#8892b0;font-weight:400;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.detail-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.detail-table td:last-child{text-align:right;font-weight:600}
.logout-btn{background:0 0;border:1px solid rgba(255,255,255,.2);color:#8892b0;padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer}
.logout-btn:hover{border-color:#ff6b6b;color:#ff6b6b}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
.hidden{display:none!important}
.debug{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,.85);color:#0f0;font-size:11px;padding:10px;border-radius:8px;max-height:200px;overflow:auto;z-index:999;word-break:break-all;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="title1"></h1>
    <p id="subtitle1"></p>
  </div>
  <div id="authView">
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuth('login',this)" id="tabLogin"></button>
        <button class="auth-tab" onclick="switchAuth('register',this)" id="tabReg"></button>
      </div>
      <div class="auth-form" id="loginForm">
        <div class="form-group"><label id="lbl1"></label><input id="lId" placeholder=""></div>
        <div class="form-group"><label id="lbl2"></label><input id="lPwd" type="password" placeholder=""></div>
        <button class="btn" onclick="login()" id="btnLogin"></button>
        <div class="error" id="lErr"></div>
      </div>
      <div class="auth-form hidden" id="regForm">
        <div class="form-group"><label id="lbl3"></label><input id="rId" placeholder=""></div>
        <div class="form-group"><label id="lbl4"></label><input id="rName" placeholder=""></div>
        <div class="form-group"><label id="lbl5"></label><input id="rPwd" type="password" placeholder=""></div>
        <button class="btn" onclick="register()" id="btnReg"></button>
        <div class="error" id="rErr"></div>
      </div>
    </div>
  </div>
  <div id="kpiView" class="hidden"></div>
</div>
<!-- debug hidden
<div class="debug" id="dbg"></div>
-->

<script>
// All Chinese text in JS to avoid encoding issues
var T = {
  title: 'KPI薪酬查询系统',
  subtitle: '中国电信乐山分公司 · 网格经理',
  login: '登录', register: '注册',
  empId: '工号', empName: '姓名', password: '密码',
  phEmpId: '请输入工号', phPwd: '请输入密码',
  phRegName: '请输入姓名（需与系统一致）',
  phRegPwd: '设置密码（至少6位）',
  btnLogin: '登录查询', btnReg: '注册账号',
  errFill: '请填写所有字段', errPwdLen: '密码至少6位',
  errMatch: '工号或姓名与系统记录不匹配',
  errExist: '该工号已注册，请直接登录',
  regOk: '注册成功！请切换到登录页面',
  errLogin: '工号或密码错误', errLoginFail: '登录失败',
  loading: '加载KPI数据中...',
  noData: '未找到KPI数据', loadFail: '加载失败',
  logout: '退出登录',
  noProfile: '未找到档案',
  scores: '维度得分', details: '业务明细', compare: '团队对比',
  scoreDetail: '得分明细', advantageWeakness: '优势与短板',
  adv: '优势: ', weak: '短板: ',
  teamCompare: '与团队平均值对比',
  teamAvg: '团队均值: ',
  kpiTotal: 'KPI总得分', deviation: '距上线偏差: ',
  rank: '第', name: '名',
  noSession: '无会话'
};

// Fill in all Chinese text
document.getElementById('title1').textContent = T.title;
document.getElementById('subtitle1').textContent = T.subtitle;
document.getElementById('tabLogin').textContent = T.login;
document.getElementById('tabReg').textContent = T.register;
document.getElementById('lbl1').textContent = T.empId;
document.getElementById('lbl2').textContent = T.password;
document.getElementById('lbl3').textContent = T.empId;
document.getElementById('lbl4').textContent = T.empName;
document.getElementById('lbl5').textContent = T.password;
document.getElementById('lId').placeholder = T.phEmpId;
document.getElementById('lPwd').placeholder = T.phPwd;
document.getElementById('rId').placeholder = T.phEmpId;
document.getElementById('rName').placeholder = T.phRegName;
document.getElementById('rPwd').placeholder = T.phRegPwd;
document.getElementById('btnLogin').textContent = T.btnLogin;
document.getElementById('btnReg').textContent = T.btnReg;

const SB_URL = 'https://fqrlmdqnoaxtqwvxmedo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcmxtZHFub2F4dHF3dnhtZWRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5Njk4ODIsImV4cCI6MjA5NjU0NTg4Mn0.V_gds7P0YIf3SJ3ikWjM4HcSXkjIuBy9WDvUxge2rso';
let sb;
try { sb = supabase.createClient(SB_URL, SB_KEY); dbg('Supabase client OK'); } catch(e) { dbg('Client error: ' + e.message); }

function dbg(m) { document.getElementById('dbg').innerHTML += m + '\n'; console.log(m); }

function switchAuth(t, el) {
  document.querySelectorAll('.auth-tab').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('loginForm').classList.toggle('hidden', t !== 'login');
  document.getElementById('regForm').classList.toggle('hidden', t !== 'register');
  document.getElementById('lErr').textContent = '';
  document.getElementById('rErr').textContent = '';
}

async function register() {
  var eid = document.getElementById('rId').value.trim();
  var ename = document.getElementById('rName').value.trim();
  var pwd = document.getElementById('rPwd').value;
  var err = document.getElementById('rErr');
  err.textContent = '';
  if (!eid || !ename || !pwd) { err.textContent = T.errFill; return; }
  if (pwd.length < 6) { err.textContent = T.errPwdLen; return; }
  try {
    dbg('Checking employee: ' + eid + ' / ' + ename);
    var res = await sb.rpc('check_employee', { eid: eid, ename: ename });
    dbg('check_employee: ' + JSON.stringify(res));
    if (res.error || !res.data) { err.textContent = T.errMatch; return; }
    var email = eid + '@kpi.local';
    dbg('Signing up: ' + email);
    var res2 = await sb.auth.signUp({ email: email, password: pwd, options: { data: { emp_id: eid, emp_name: ename } } });
    if (res2.error) {
      var msg = res2.error.message;
      if (msg.indexOf('already') !== -1 || msg.indexOf('Database error') !== -1) err.textContent = '该工号已注册，请直接登录';
      else err.textContent = '注册失败: ' + msg;
      return;
    }
    dbg('SignUp OK');
    err.className = 'success';
    err.textContent = T.regOk;
  } catch(e) { dbg('Register exception: ' + e.message); err.textContent = T.errLoginFail + ': ' + e.message; }
}

async function login() {
  var eid = document.getElementById('lId').value.trim();
  var pwd = document.getElementById('lPwd').value;
  var err = document.getElementById('lErr');
  err.textContent = '';
  if (!eid || !pwd) { err.textContent = T.errFill; return; }
  try {
    var email = eid + '@kpi.local';
    dbg('Signing in: ' + email);
    var res = await sb.auth.signInWithPassword({ email: email, password: pwd });
    if (res.error) { dbg('Login error: ' + res.error.message); err.textContent = T.errLogin; return; }
    dbg('Login OK, uid=' + res.data.user.id);
    await loadKPI();
  } catch(e) { dbg('Login exception: ' + e.message); err.textContent = T.errLoginFail + ': ' + e.message; }
}

async function doLogout() {
  await sb.auth.signOut();
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('kpiView').classList.add('hidden');
  document.getElementById('lPwd').value = '';
}

async function loadKPI() {
  var kv = document.getElementById('kpiView');
  kv.classList.remove('hidden');
  document.getElementById('authView').classList.add('hidden');
  kv.innerHTML = '<div class="card"><div style="text-align:center;padding:40px;color:#8892b0">' + T.loading + '</div></div>';
  try {
    dbg('Querying profiles...');
    var res1 = await sb.from('profiles').select('*').single();
    dbg('Profile result: ' + JSON.stringify(res1));
    if (!res1.data) { dbg(T.noProfile); doLogout(); return; }
    var prof = res1.data;

    dbg('Querying kpi_data...');
    var res2 = await sb.from('kpi_data').select('*');
    dbg('KPI result count: ' + (res2.data ? res2.data.length : 'null') + ' err: ' + JSON.stringify(res2.error));
    if (res2.error || !res2.data || res2.data.length === 0) {
      kv.innerHTML = '<div class="card"><div class="error" style="padding:40px">' + T.noData + ': ' + JSON.stringify(res2.error) + '</div></div>';
      return;
    }
    render(res2.data[0], prof);
  } catch(e) {
    dbg('loadKPI exception: ' + e.message);
    kv.innerHTML = '<div class="card"><div class="error" style="padding:40px">' + T.loadFail + ': ' + e.message + '</div></div>';
  }
}

function render(d, prof) {
  var kv = document.getElementById('kpiView');
  var keys = Object.keys(d);
  var cols = keys.filter(function(k) { return k !== 'id' && k !== 'created_at'; });

  dbg('All columns: ' + JSON.stringify(cols));
  dbg('First 4 cols: ' + cols[0] + ' | ' + cols[1] + ' | ' + cols[2] + ' | ' + cols[3]);

  var html = '';

  // Top bar
  html += '<div class="card top-bar"><span style="font-size:14px;color:#8892b0">' + prof.emp_name + '</span>';
  html += '<button class="logout-btn" onclick="doLogout()">' + T.logout + '</button></div>';

  // Main card
  html += '<div class="card">';

  var empName = d[cols[1]] || '-';
  var star = d[cols[2]] || '-';
  var district = d[cols[3]] || '-';

  // Find ranking
  var rankVal = null;
  cols.forEach(function(k) { var v = d[k]; if (typeof v === 'number' && v >= 1 && v <= 37 && v === Math.floor(v)) rankVal = v; });

  html += '<div class="kpi-header"><div>';
  html += '<div class="kpi-name">' + empName + '</div>';
  html += '<div style="font-size:13px;color:#8892b0;margin-top:4px">' + district + ' · ' + star + '</div>';
  html += '</div><div class="kpi-badge">' + (rankVal ? T.rank + rankVal + T.name : '') + '</div></div>';

  // Separate scores vs team averages
  var scores = {}, teamAvgs = {};
  cols.forEach(function(k, i) {
    if (i < 4) return;
    var v = d[k];
    if (v === null || v === undefined) return;
    if (typeof v === 'number') {
      if (k.indexOf('团队值') !== -1 || k.indexOf('标准差') !== -1 || k.indexOf('最高分') !== -1) {
        teamAvgs[k] = v;
      } else {
        scores[k] = v;
      }
    }
  });

  // KPI total = max score value
  var kpiTotal = 0, kpiKey = '';
  for (var sk in scores) { if (scores[sk] > kpiTotal) { kpiTotal = scores[sk]; kpiKey = sk; } }
  delete scores[kpiKey];

  // Find deviation (a number between 0-100 that's not a score)
  var devKey = null;
  for (var dk in scores) { var dv = d[dk]; if (typeof dv === 'number' && dv > 0 && dv < 100) { devKey = dk; break; } }

  html += '<div class="kpi-score">';
  html += '<div class="number">' + kpiTotal.toFixed(2) + '</div>';
  html += '<div class="label">' + T.kpiTotal + '</div>';
  if (devKey) html += '<div class="sub">' + T.deviation + d[devKey] + '</div>';
  html += '</div>';

  // Tabs
  html += '<div class="tabs">';
  html += '<button class="tab active" onclick="swTab(0)">' + T.scores + '</button>';
  html += '<button class="tab" onclick="swTab(1)">' + T.details + '</button>';
  html += '<button class="tab" onclick="swTab(2)">' + T.compare + '</button>';
  html += '</div>';

  // Tab 0: Scores
  html += '<div id="t0">';
  html += '<div class="section"><div class="section-title">' + T.scoreDetail + '</div><div class="scores-grid">';
  for (var sk in scores) {
    var avg = teamAvgs[sk.replace('得分', '团队值')] || null;
    var above = avg ? scores[sk] >= avg : true;
    var displayName = sk.replace('_得分', '');
    html += '<div class="score-item">';
    html += '<div class="name">' + displayName + (avg ? ' <span style="color:#5a6380">(均' + avg + ')</span>' : '') + '</div>';
    html += '<div class="value" style="color:' + (above ? '#66bb6a' : '#ef5350') + '">' + scores[sk] + '</div>';
    html += '</div>';
  }
  html += '</div></div>';

  // Tags (优势/短板)
  var tagKeys = cols.filter(function(k) { return Array.isArray(d[k]) && d[k].length > 0; });
  if (tagKeys.length > 0) {
    html += '<div class="section"><div class="section-title">' + T.advantageWeakness + '</div><div class="tag-row">';
    tagKeys.forEach(function(k, i) {
      var cls = i === 0 ? 'tag-green' : 'tag-red';
      var lbl = i === 0 ? T.adv : T.weak;
      d[k].forEach(function(t) { html += '<span class="tag ' + cls + '">' + lbl + t + '</span>'; });
    });
    html += '</div></div>';
  }
  html += '</div>';

  // Tab 1: Details (JSON string fields)
  html += '<div id="t1" class="hidden">';
  cols.forEach(function(k) {
    var v = d[k];
    if (typeof v === 'string' && v.length > 2 && (v[0] === '[' || v[0] === '{')) {
      try {
        var obj = JSON.parse(v);
        if (typeof obj === 'object' && !Array.isArray(obj)) {
          html += '<div class="section"><div class="section-title">' + k + '</div>';
          html += '<table class="detail-table"><thead><tr><th>指标</th><th>得分</th></tr></thead><tbody>';
          for (var nk in obj) { html += '<tr><td>' + nk + '</td><td>' + obj[nk] + '</td></tr>'; }
          html += '</tbody></table></div>';
        }
      } catch(e) {}
    }
  });
  html += '</div>';

  // Tab 2: Compare
  html += '<div id="t2" class="hidden">';
  html += '<div class="section"><div class="section-title">' + T.teamCompare + '</div><div class="scores-grid">';
  for (var ak in teamAvgs) {
    var avg = teamAvgs[ak];
    var myKey = ak.replace('团队值', '得分');
    var myVal = d[myKey] || 0;
    var pct = avg > 0 ? ((myVal - avg) / avg * 100).toFixed(1) : 0;
    var color = pct >= 0 ? '#66bb6a' : '#ef5350';
    var name = ak.replace('团队值', '').replace('_得分', '');
    html += '<div class="score-item">';
    html += '<div class="name">' + name + '</div>';
    html += '<div class="value" style="color:' + color + '">' + myVal + ' <span style="font-size:13px">(' + (pct >= 0 ? '+' : '') + pct + '%)</span></div>';
    html += '<div class="name" style="margin-top:4px">' + T.teamAvg + avg + '</div>';
    html += '</div>';
  }
  html += '</div></div></div>';

  kv.innerHTML = html;
  dbg('Render complete');
}

function swTab(i) {
  document.querySelectorAll('.tabs .tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tabs .tab')[i].classList.add('active');
  for (var j = 0; j < 3; j++) document.getElementById('t' + j).classList.toggle('hidden', j !== i);
}

// Auto login
(async function() {
  try {
    var res = await sb.auth.getSession();
    dbg('Session check: ' + (res.data.session ? 'has session' : T.noSession));
    if (res.data.session) await loadKPI();
  } catch(e) { dbg('Init error: ' + e.message); }
})();
</script>
</body>
</html>
