function convertSupabaseToFormat(d){
  // Convert Supabase raw data to the format expected by charts
  var keys=Object.keys(d);
  var cols=keys.filter(function(k){return k!=='id'&&k!=='created_at'});

  var name=d[cols[1]]||'-';
  var star=d[cols[2]]||'-';
  var dept=d[cols[3]]||'-';
  var branch=d[cols[4]]||'-';

  // Find KPI total and rank
  var total=0,rank=1;
  var scores={};
  cols.forEach(function(k,i){if(i<4)return;var v=d[k];if(v===null||v===undefined)return;if(typeof v==='number'&&k.indexOf('团队')===-1&&k.indexOf('标准差')===-1&&k.indexOf('最高分')===-1)scores[k]=v});
  for(var sk in scores){if(scores[sk]>total)total=scores[sk]}
  var kpiKey='';for(var sk in scores){if(scores[sk]===total){kpiKey=sk;break}}
  delete scores[kpiKey];
  // Find rank
  var rankKey=null;cols.forEach(function(k){var v=d[k];if(typeof v==='number'&&v>=1&&v<=37&&v===Math.floor(v))rankKey=k});
  if(rankKey)rank=d[rankKey];

  // Map to l1Scores
  var l1Names=['积分','重点业务','规定动作','加扣分项','分局长打分'];
  var l1Scores={};
  // Find matching columns
  cols.forEach(function(k){var v=d[k];if(typeof v!=='number'||v===null)return;
    if(k.indexOf('积分_得分')!==-1||k==='积分_得分')l1Scores['积分']=v;
    else if(k.indexOf('重点业务_得分')!==-1)l1Scores['重点业务']=v;
    else if(k.indexOf('规定动作_得分')!==-1)l1Scores['规定动作']=v;
    else if(k.indexOf('加扣分项_得分')!==-1)l1Scores['加扣分项']=v;
    else if(k.indexOf('分局长')!==-1)l1Scores['分局长打分']=v;
  });

  // Map l2 scores
  var l2Scores={};
  var l2ToL1={};
  cols.forEach(function(k){var v=d[k];if(typeof v!=='number'||v===null)return;
    if(l1Scores[k]!==undefined)return; // skip l1 columns
    if(k.indexOf('团队')!==-1||k.indexOf('标准差')!==-1||k.indexOf('最高分')!==-1)return;
    // Clean up column name
    var clean=k.replace('_得分','');
    l2Scores[clean]=v;
    // Determine l1 parent
    if(k.indexOf('积分')!==-1)l2ToL1[clean]='积分';
    else if(k.indexOf('FTTR')!==-1||k.indexOf('宽带')!==-1||k.indexOf('两线')!==-1||k.indexOf('视联网')!==-1||k.indexOf('酒美')!==-1||k.indexOf('云存')!==-1)l2ToL1[clean]='重点业务';
    else if(k.indexOf('拜访')!==-1||k.indexOf('维系')!==-1||k.indexOf('ICT')!==-1||k.indexOf('电脑')!==-1||k.indexOf('小微')!==-1)l2ToL1[clean]='规定动作';
    else if(k.indexOf('安全')!==-1||k.indexOf('投诉')!==-1||k.indexOf('锁存')!==-1||k.indexOf('续签')!==-1||k.indexOf('智投')!==-1||k.indexOf('量子')!==-1)l2ToL1[clean]='加扣分项';
    else l2ToL1[clean]='其他';
  });

  // Advantages/weaknesses
  var advantages=[],weaknesses=[];
  var advKey=null,weakKey=null;
  cols.forEach(function(k){if(Array.isArray(d[k])){if(!advKey)advKey=k;else weakKey=k}});
  if(advKey)advantages=d[advKey]||[];
  if(weakKey)weaknesses=d[weakKey]||[];

  return {
    name:name, star:star, dept:dept, branch:branch,
    total:total, totalRank:rank,
    l1Scores:l1Scores, l2Scores:l2Scores, l2ToL1:l2ToL1,
    advantages:advantages, weaknesses:weaknesses,
    weaknessesDetail:[]
  };
}

  html+='<div class="panel" id="panel-improve"><div id="improveList"></div></div>';

  // Model panel
  html+='<div class="panel" id="panel-model"><div class="section-title">KPI指标体系（100分封顶，加扣分项另计）</div><table id="modelTable"></table></div>';

  html+='</div></div>';

  document.getElementById('mainView').innerHTML=html;

  // Init tabs
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
      document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
      tab.classList.add('active');
      document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
      if(tab.dataset.tab==='personal')renderPersonal(emp);
      if(tab.dataset.tab==='team')renderTeam(emp);
      if(tab.dataset.tab==='improve')renderImprove(emp);
    });
  });

  // Init charts
  initCharts();
  renderPersonal(emp);
  renderModel();
}

var radarChart,barChart;
function initCharts(){
  radarChart=echarts.init(document.getElementById('radarChart'));
  barChart=echarts.init(document.getElementById('barChart'));
  window.addEventListener('resize',function(){radarChart.resize();barChart.resize()});
}

function renderPersonal(emp){
  // Stats
  document.getElementById('personalStats').innerHTML=
    '<div class="stat-card"><div class="label">KPI总分</div><div class="value">'+emp.total+'</div></div>'+
    '<div class="stat-card"><div class="label">排名</div><div class="value">'+emp.totalRank+'</div></div>'+
    '<div class="stat-card"><div class="label">星级</div><div class="value" style="font-size:18px">'+emp.star+'</div></div>'+
    '<div class="stat-card"><div class="label">优势项</div><div class="value green">'+emp.advantages.length+'</div></div>'+
    '<div class="stat-card"><div class="label">短板项</div><div class="value red">'+emp.weaknesses.length+'</div></div>';

  var l1Names=JSON.parse(L1_NAMES);
  var basicL1=l1Names.filter(function(n){return n!=='加扣分项'});

  // Radar
  var indicator=basicL1.map(function(n){return{name:n,max:L1_MAX?L1_MAX[n]||100:100}});
  var teamAvgs=allTeamStats?allTeamStats:{};
  var avgVals=basicL1.map(function(n){return teamAvgs[n]?teamAvgs[n].avg:0});

  radarChart.setOption({
    title:{text:emp.name+' 雷达图（基础指标）',left:'center',textStyle:{fontSize:14}},
    tooltip:{},
    legend:{data:['个人得分','团队均值'],bottom:0},
    radar:{indicator:indicator,shape:'polygon',splitNumber:5},
    series:[{type:'radar',data:[
      {value:basicL1.map(function(n){return emp.l1Scores[n]||0}),name:'个人得分',lineStyle:{color:'#1a3a5c'},areaStyle:{color:'rgba(26,58,92,0.15)'},itemStyle:{color:'#1a3a5c'}},
      {value:avgVals,name:'团队均值',lineStyle:{color:'#999',type:'dashed'},areaStyle:{color:'rgba(153,153,153,0.05)'},itemStyle:{color:'#999'}}
    ]}]
  },true);

  // Bar - deviation
  var diffData=l1Names.map(function(n){return{name:n,value:parseFloat(((emp.l1Scores[n]||0)-(teamAvgs[n]?teamAvgs[n].avg:0)).toFixed(2))}});
  barChart.setOption({
    title:{text:emp.name+' 与团队均值偏差',left:'center',textStyle:{fontSize:14}},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:l1Names,axisLabel:{rotate:20,fontSize:11}},
    yAxis:{type:'value',name:'偏差'},
    series:[{type:'bar',data:diffData.map(function(d){return{value:d.value,itemStyle:{color:d.value>=0?'#2e7d32':'#c62828'}}}),label:{show:true,position:'top',formatter:'{c}',fontSize:11}}]
  },true);

  // L1 table
  var html='<thead><tr><th>一级指标</th><th>满分</th><th>得分</th><th>团队均值</th><th>偏差</th><th>判定</th></tr></thead><tbody>';
  l1Names.forEach(function(n){
    var score=emp.l1Scores[n]||0;
    var avg=teamAvgs[n]?teamAvgs[n].avg:0;
    var diff=(score-avg).toFixed(2);
    var judge='达标',badge='blue';
    if(emp.advantages.indexOf(n)!==-1){judge='优势';badge='green'}
    else if(emp.weaknesses.indexOf(n)!==-1){judge='短板';badge='red'}
    var mx=L1_MAX?L1_MAX[n]||'-':'-';
    html+='<tr><td>'+n+'</td><td>'+mx+'</td><td>'+score+'</td><td>'+avg+'</td><td>'+diff+'</td><td><span class="badge '+badge+'">'+judge+'</span></td></tr>';
  });
  html+='</tbody>';
  document.getElementById('personalTable').innerHTML=html;

  // L2 table
  var entries=Object.entries(emp.l2Scores);
  html='<thead><tr><th>二级指标</th><th>得分</th><th>所属一级指标</th></tr></thead><tbody>';
  entries.forEach(function(e){html+='<tr><td>'+e[0]+'</td><td>'+e[1]+'</td><td>'+(emp.l2ToL1[e[0]]||'-')+'</td></tr>'});
  html+='</tbody>';
  document.getElementById('l2Table').innerHTML=html;
}

function renderTeam(emp){
  var ts=allTeamStats||{};
  document.getElementById('teamStats').innerHTML=
    '<div class="stat-card"><div class="label">你的排名</div><div class="value">'+emp.totalRank+'</div></div>'+
    '<div class="stat-card"><div class="label">团队人数</div><div class="value">'+(ts.totalCount||37)+'</div></div>'+
    '<div class="stat-card"><div class="label">团队均分</div><div class="value">'+(ts.teamAvg||0)+'</div></div>'+
    '<div class="stat-card"><div class="label">你的得分</div><div class="value">'+emp.total+'</div></div>'+
    '<div class="stat-card"><div class="label">分位</div><div class="value">'+(emp.totalRank<=Math.floor((ts.totalCount||37)*0.2)?'前20%':emp.totalRank>Math.floor((ts.totalCount||37)*0.8)?'后20%':'中段')+'</div></div>';

  // Highlight rank card
  var rankHtml='<div style="margin-top:24px;padding:24px;background:linear-gradient(135deg,#1a3a5c,#2d5f8a);border-radius:12px;color:#fff;text-align:center">';
  rankHtml+='<div style="font-size:13px;opacity:0.8">你的KPI排名</div>';
  rankHtml+='<div style="font-size:64px;font-weight:800;margin:12px 0">'+emp.totalRank+'</div>';
  rankHtml+='<div style="font-size:16px;opacity:0.8">/ '+(ts.totalCount||37)+' 人</div>';
  var pct=((ts.totalCount||37)-emp.totalRank+1)/(ts.totalCount||37)*100;
  rankHtml+='<div style="margin-top:12px;font-size:14px;opacity:0.7">超越 '+(pct).toFixed(1)+'% 的同事</div>';
  rankHtml+='</div>';
  document.getElementById('rankCard').innerHTML=rankHtml;
}

function renderImprove(emp){
  var html='';
  if(emp.weaknesses.length===0){
    html='<div style="padding:40px;text-align:center;color:#999;font-size:14px">暂无短板项，表现优秀！</div>';
  }else{
    emp.weaknesses.forEach(function(w){
      html+='<div style="margin-bottom:16px;padding:16px 20px;background:#f8f9fb;border-radius:8px;border-left:4px solid #c62828">';
      html+='<div style="font-weight:600;font-size:15px;color:#c62828;margin-bottom:8px">短板项：'+w+'</div>';
      var score=emp.l1Scores[w]||0;
      var avg=allTeamStats&&allTeamStats[w]?allTeamStats[w].avg:0;
      html+='<div style="font-size:13px;color:#666">当前得分：<strong>'+score+'</strong> | 团队均值：'+avg+' | 差距：'+(score-avg).toFixed(2)+'</div>';
      html+='</div>';
    });
  }
  // Suggestions
  html+='<div style="margin-top:24px;padding:20px;background:#e8f5e9;border-radius:8px">';
  html+='<div style="font-weight:600;color:#2e7d32;margin-bottom:8px">改进建议</div>';
  html+='<div style="font-size:13px;color:#333;line-height:1.8">';
  html+='拆解目标、优化客户结构、提升转化率、减少客户流失。<br>';
  html+='重点关注得分低于团队平均值的维度，制定针对性提升计划。<br>';
  html+='充分利用优势项带动短板项，形成协同效应。';
  html+='</div></div>';
  document.getElementById('improveList').innerHTML=html;
}

function renderModel(){
  var model=JSON.parse(MODEL);
  var html='<thead><tr><th>一级指标</th><th>二级指标</th><th>二级权重(%)</th><th>满分</th><th>评分标准</th></tr></thead><tbody>';
  model.forEach(function(r){
    var mx=r.maxScore===-999?'不封顶(扣分)':r.maxScore;
    html+='<tr><td>'+r.l1+'</td><td>'+r.l2+'</td><td>'+r.weight+'</td><td>'+mx+'</td><td style="text-align:left;white-space:normal;max-width:300px">'+r.scoringRule+'</td></tr>';
  });
  html+='</tbody>';
  document.getElementById('modelTable').innerHTML=html;
}

// Auto login
(async function(){
  try{
    var res=await sb.auth.getSession();
    if(res.data.session)await loadApp();
  }catch(e){}
})();
</script>
