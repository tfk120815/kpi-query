<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网格经理KPI薪酬查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;background:linear-gradient(135deg,#1a3a6b 0%,#2d5aa0 100%);padding:20px;text-align:center;color:#fff}
.header h1{font-size:22px;font-weight:600;letter-spacing:2px}
.header p{font-size:13px;margin-top:6px;opacity:.8}
.container{max-width:700px;width:100%;padding:20px;flex:1}
.search-box{background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;margin-bottom:16px}
.search-box label{font-size:15px;color:#333;font-weight:500;display:block;margin-bottom:14px}
.search-box .input-group{display:flex;gap:10px;justify-content:center}
.search-box input{width:220px;height:44px;border:2px solid #d9d9d9;border-radius:8px;padding:0 14px;font-size:15px;outline:none;transition:border-color .3s}
.search-box input:focus{border-color:#2d5aa0}
.search-box button{height:44px;padding:0 24px;background:linear-gradient(135deg,#2d5aa0,#1a3a6b);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:opacity .2s}
.search-box button:hover{opacity:.9}
.result{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.result .name-bar{background:linear-gradient(135deg,#2d5aa0,#1a3a6b);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.result .name-bar h2{font-size:18px;font-weight:600}
.result .name-bar .rank{font-size:14px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px}
.result .info-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#f8f9fb;border-bottom:1px solid #e8e8e8;font-size:13px;color:#666}
.result .info-row span{background:#eef2f9;padding:3px 10px;border-radius:4px}
.section{padding:16px 20px;border-bottom:1px solid #f0f0f0}
.section h3{font-size:14px;color:#2d5aa0;margin-bottom:12px;font-weight:600}
.score-table{width:100%;border-collapse:collapse;font-size:13px}
.score-table th{background:#f0f4fa;color:#333;font-weight:500;padding:8px 10px;text-align:center;border:1px solid #e8e8e8}
.score-table td{padding:8px 10px;text-align:center;border:1px solid #e8e8e8}
.score-table .advantage{background:#e6f7e6;color:#1a7a1a}
.score-table .weakness{background:#ffe6e6;color:#c41d1d}
.score-table .normal{background:#fff}
.tag-row{padding:12px 20px}
.tag{display:inline-block;padding:4px 12px;border-radius:4px;font-size:12px;margin-right:6px;margin-bottom:4px}
.tag-green{background:#e6f7e6;color:#1a7a1a}
.tag-red{background:#ffe6e6;color:#c41d1d}
.no-result{text-align:center;padding:30px;color:#999;font-size:15px}
.footer{width:100%;text-align:center;padding:16px;color:#999;font-size:12px}
.tips{background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:12px;color:#ad6800}
@media(max-width:500px){.search-box .input-group{flex-direction:column;align-items:center}.search-box input{width:100%}.container{padding:12px}}
</style>
</head>

  if(emp["短板项"]&&emp["短板项"].length>0){for(var m=0;m<emp["短板项"].length;m++){h+='<span class="tag tag-red">短板：'+emp["短板项"][m]+'</span>'}}
  h+='</div></div>';
  area.innerHTML=h;
}
document.getElementById("empId").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
</script>
