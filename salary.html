<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>员工薪酬分析 - 2026年5月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333;font-size:14px;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
.login-card{background:#fff;border-radius:16px;padding:40px 48px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .logo{text-align:center;margin-bottom:32px}
.login-card .logo h1{font-size:22px;color:#1a1a2e;font-weight:700}
.login-card .logo p{font-size:13px;color:#8c8c9a;margin-top:4px}
.login-card .logo .icon{width:56px;height:56px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#0f3460}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0f3460,#1a1a2e);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-err{color:#ef4444;font-size:12px;text-align:center;margin-top:12px;display:none}
.app{display:none}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .icon-sm{width:32px;height:32px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:bold}
.topbar .brand h2{font-size:16px;color:#1a1a2e}
.topbar .user-info{font-size:13px;color:#666;display:flex;align-items:center;gap:12px}
.topbar .logout-btn{background:none;border:1px solid #ddd;color:#666;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.topbar .logout-btn:hover{background:#f5f5f5}
.container{max-width:960px;margin:0 auto;padding:20px 24px}
.card-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#8c8c9a;margin-bottom:6px}
.card .value{font-size:26px;font-weight:700;color:#1a1a2e}
.card .value.accent{color:#0f3460}
.card .value.up{color:#10b981}
.card .value.down{color:#ef4444}
.card .sub{font-size:11px;margin-top:4px;color:#8c8c9a}
.section{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.section h3{font-size:15px;color:#1a1a2e;margin-bottom:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section h3::before{content:'';width:4px;height:18px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:2px}
.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bar-item .bl{width:100px;text-align:right;color:#8c8c9a;flex-shrink:0}
.bar-item .bb{flex:1;height:24px;background:#f0f0f5;border-radius:6px;overflow:hidden;position:relative}
.bar-item .bf{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600;min-width:30px;transition:width .6s}
.detail-table{width:100%;border-collapse:collapse;font-size:13px}
.detail-table th{background:#f8f9fc;color:#555;padding:10px 12px;text-align:center;font-weight:600;border-bottom:2px solid #e5e7eb;white-space:nowrap}
.detail-table td{padding:10px 12px;text-align:center;border-bottom:1px solid #f0f0f5;white-space:nowrap}
.detail-table tr:hover td{background:#fafbff}
.tag-up{color:#10b981;font-weight:600}
.tag-down{color:#ef4444;font-weight:600}
/* KPI grid - 2 columns like 薪酬查询系统 */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi-item{border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.kpi-item .ki-left{display:flex;flex-direction:column;gap:4px;flex:1}
.kpi-item .ki-name{font-size:13px;color:#555}
.kpi-item .ki-weight{font-size:11px;color:#aaa}
.kpi-item .ki-bar{width:100%;height:6px;background:#f0f0f5;border-radius:3px}
.kpi-item .ki-fill{height:100%;border-radius:3px;transition:width .6s}
.kpi-item .ki-score{font-size:18px;font-weight:700;flex-shrink:0;margin-left:12px}
.analysis-box{background:#f8f9fc;border-radius:10px;padding:14px 18px;margin-bottom:8px;font-size:13px;line-height:1.7}
.analysis-box.a-good{border-left:4px solid #10b981}
.analysis-box.a-bad{border-left:4px solid #ef4444}
.analysis-box.a-info{border-left:4px solid #0f3460}
.analysis-box b{color:#1a1a2e}
.settle-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.settle-card{background:#f8f9fc;border-radius:8px;padding:14px;text-align:center}
.settle-card .sl{font-size:11px;color:#8c8c9a;margin-bottom:4px}
.settle-card .sv{font-size:18px;font-weight:700;color:#1a1a2e}
/* 酬金对比条 */
.cj-compare{margin-top:8px}
.cj-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.cj-bar-wrap .cb-label{width:60px;text-align:right;color:#8c8c9a;flex-shrink:0}
.cj-bar-wrap .cb-track{flex:1;height:20px;background:#f0f0f5;border-radius:5px;overflow:hidden}
.cj-bar-wrap .cb-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff;font-weight:600;min-width:30px}
.cj-bar-wrap .cb-val{width:90px;flex-shrink:0;color:#555;font-size:11px}
@media(max-width:640px){.card-row{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:1fr}.settle-box{grid-template-columns:1fr}}
</style>
</head>

<div class="login-wrap" id="loginPage">
<div class="login-card">
<div class="logo"><div class="icon">薪</div><h1>员工薪酬分析</h1><p>2026年5月 · 外渠客户经理薪酬自助查询</p></div>
<div class="field"><label>姓名</label><input id="loginName" placeholder="请输入姓名"></div>
<div class="field"><label>人力编码</label><input id="loginHr" placeholder="请输入人力编码" type="password"></div>

<div class="login-err" id="loginErr">姓名或人力编码不正确，请确认后重试</div>
</div>
</div>
<div class="app" id="app">
<div class="topbar">
<div class="brand"><div class="icon-sm">薪</div><h2>员工薪酬分析</h2></div>
<div class="user-info"><span id="uName"></span><button class="logout-btn" onclick="doLogout()">退出</button></div>
</div>
<div class="container" id="content"></div>
</div>

function doLogin(){var name=document.getElementById('loginName').value.trim();var hr=document.getElementById('loginHr').value.trim();if(!name||!hr){document.getElementById('loginErr').style.display='block';return;}var user=null;for(var i=0;i<DATA.length;i++){if(DATA[i].n===name&&DATA[i].h===hr){user=DATA[i];break;}}if(!user){document.getElementById('loginErr').style.display='block';return;}curUser=user;document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';document.getElementById('uName').textContent=user.n;render();}
function doLogout(){curUser=null;document.getElementById('app').style.display='none';document.getElementById('loginPage').style.display='flex';document.getElementById('loginName').value='';document.getElementById('loginHr').value='';document.getElementById('loginErr').style.display='none';}
function f(v){if(typeof v!=='number')return v;if(v<0)return '-'+Math.abs(v).toFixed(2);return v.toFixed(2)}
function fmt(v){if(typeof v!=='number')return v;return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(v){if(typeof v!=='number'||v===0)return '-';return (v*100).toFixed(1)+'%'}
function render(){var u=curUser,t=TEAM,c=document.getElementById('content');var html='';

// === 概览卡片 ===
html+='<div class="card-row">';
html+='<div class="card"><div class="label">员工实发</div><div class="value accent">'+fmt(u.sf)+'元</div>';
var sfDiff=u.sf-t.avg_s;
html+='<div class="sub" style="color:'+(sfDiff>=0?'#10b981':'#ef4444')+'">比均值'+(sfDiff>=0?'高 +':'低 ')+fmt(Math.abs(sfDiff))+'元</div></div>';
html+='<div class="card"><div class="label">KPI得分</div><div class="value">'+u.kt+'分</div>';
html+='<div class="sub">全员平均 '+t.avg_k+'分</div></div>';
html+='<div class="card"><div class="label">5月酬金</div><div class="value">'+fmt(u.cj)+'元</div>';
html+='<div class="sub">全员均值 '+fmt(t.avg_cj)+'元</div></div>';
html+='<div class="card"><div class="label">星级补贴</div><div class="value">'+fmt(u.xb)+'元</div>';
html+='<div class="sub">'+(u.x||'未评级')+'</div></div>';
html+='</div>';

// === 酬金对比（与均值、最高值比较）===
html+='<div class="section"><h3>5月酬金对比</h3>';
var cjMax=Math.max(t.max_cj,1);
var cjBars=[
  {label:'我的酬金',val:u.cj,color:'#0f3460'},
  {label:'全员均值',val:t.avg_cj,color:'#6366f1'},
  {label:'全员最高',val:t.max_cj,color:'#10b981'}
];
for(var b=0;b<cjBars.length;b++){var bar=cjBars[b];var w=Math.min(Math.abs(bar.val)/cjMax*100,100);html+='<div class="cj-bar-wrap"><div class="cb-label">'+bar.label+'</div><div class="cb-track"><div class="cb-fill" style="width:'+w+'%;background:'+bar.color+'">'+fmt(bar.val)+'</div></div><div class="cb-val">'+(bar.val===u.cj?'':fmt(bar.val))+'</div></div>';}
html+='</div>';

// === 实发明细 ===
html+='<div class="section"><h3>实发明细</h3>';
html+='<div class="settle-box">';
var settles=[['基薪含保障',u.sj],['保障费(个+企)',u.bz],['KPI得分(百分制)',u.ks],['KPI实际发放',u.kf],['新星级补贴',u.xb],['激励/补贴',u.jl],['补充激励',u.bc],['5月申诉',u.sq],['保底机卡考核',u.bd],['合同考核',u.ht],['缺勤扣减',u.kc],['员工实发',u.sf],['5月酬金',u.cj],['5月清算',u.qs],['个人保障费',u.gr],['个税扣除',u.gs],['大病和补充',u.db],['技术服务费合计',u.zj]];
for(var s=0;s<settles.length;s++){var sv=settles[s];var cls=sv[1]<0?' style="color:#ef4444"':'';html+='<div class="settle-card"><div class="sl">'+sv[0]+'</div><div class="sv"'+cls+'>'+fmt(sv[1])+'</div></div>';}
html+='</div></div>';

// === KPI各项得分（2列grid，参考薪酬查询系统样式）===
html+='<div class="section"><h3>5月KPI各项得分</h3>';
html+='<div class="kpi-grid">';
var ki=u.ki||{};var kpiKeys=['jf','rh','ic','zx','gd','qt','yd','xw','xq','ts','fj'];
for(var k=0;k<kpiKeys.length;k++){var key=kpiKeys[k];var score=ki[key]||0;var max=KPI_MAX[key]||100;var pctVal=max>0?Math.min(Math.abs(score)/max*100,100):0;var color=score>=max*0.8?'#10b981':score>=max*0.5?'#f59e0b':score>0?'#ef4444':'#d1d5db';if(score<0)color='#ef4444';
html+='<div class="kpi-item"><div class="ki-left"><div class="ki-name">'+KPI_NAMES[key]+'<span class="ki-weight"> (满'+max+'分)</span></div><div class="ki-bar"><div class="ki-fill" style="width:'+Math.max(pctVal,4)+'%;background:'+color+'"></div></div></div><div class="ki-score" style="color:'+color+'">'+f(score)+'</div></div>';}
html+='</div></div>';

// === 业务完成率 ===
html+='<div class="section"><h3>业务完成率</h3>';
var rates=[['积分完成率*',ki.jr||0],['融合宽带完成率',ki.rr||0],['标准ICT完成率',ki.ir||0],['四大战新完成率',ki.zr||0],['客户拜访完成率',ki.gr2||0]];
for(var r=0;r<rates.length;r++){var rv=rates[r];var w=Math.min(rv[1]*100,120);var c2=w>=100?'#10b981':w>=60?'#f59e0b':'#ef4444';html+='<div class="bar-item"><div class="bl">'+rv[0]+'</div><div class="bb"><div class="bf" style="width:'+Math.min(w,100)+'%;background:'+c2+'">'+(rv[1]*100).toFixed(1)+'%</div></div></div>';}
html+='<div style="font-size:11px;color:#aaa;margin-top:6px">*积分完成率为综合完成率（净增/新增取高），由得分推导</div>';
html+='</div>';

// === 与全员对比 ===
html+='<div class="section"><h3>与全员对比</h3>';
html+='<div class="bar-item"><div class="bl">我的实发</div><div class="bb"><div class="bf" style="width:'+Math.min(Math.abs(u.sf)/t.max_s*100,100)+'%;background:#0f3460">'+fmt(u.sf)+'元</div></div></div>';
html+='<div class="bar-item"><div class="bl">全员平均</div><div class="bb"><div class="bf" style="width:'+Math.min(Math.abs(t.avg_s)/t.max_s*100,100)+'%;background:#6366f1">'+fmt(t.avg_s)+'元</div></div></div>';
html+='<div class="bar-item"><div class="bl">全员最高</div><div class="bb"><div class="bf" style="width:100%;background:#10b981">'+fmt(t.max_s)+'元</div></div></div>';
html+='</div>';

// === 薪酬分析 ===
html+='<div class="section"><h3>薪酬分析</h3>';
var analyses=[];
if(u.sf>=t.avg_s*1.2)analyses.push({t:'good',m:'您的实发薪酬高于全员平均水平20%以上，表现优秀！'});
else if(u.sf<t.avg_s*0.8)analyses.push({t:'bad',m:'您的实发薪酬低于全员平均水平20%，建议关注KPI得分提升。'});
else analyses.push({t:'info',m:'您的实发薪酬处于全员中等水平。'});
if(u.kt>=80)analyses.push({t:'good',m:'KPI得分<b>'+u.kt+'分</b>，达到优秀水平(80分以上)。'});
else if(u.kt>=60)analyses.push({t:'info',m:'KPI得分<b>'+u.kt+'分</b>，处于合格水平。'});
else analyses.push({t:'bad',m:'KPI得分<b>'+u.kt+'分</b>，低于60分，建议重点关注业务完成率提升。'});
if(u.cj>=t.avg_cj*1.2)analyses.push({t:'good',m:'5月酬金<b>'+fmt(u.cj)+'元</b>，高于全员均值20%以上，业务拓展能力强。'});
else if(u.cj<t.avg_cj*0.8)analyses.push({t:'bad',m:'5月酬金<b>'+fmt(u.cj)+'元</b>，低于全员均值，建议加大业务拓展力度。'});
else analyses.push({t:'info',m:'5月酬金<b>'+fmt(u.cj)+'元</b>，处于全员中等水平。'});
if(ki.jr<0.6)analyses.push({t:'bad',m:'积分完成率仅'+pct(ki.jr)+'，是拉低KPI的主要因素。'});
if(ki.rr<0.5)analyses.push({t:'bad',m:'融合宽带完成率'+pct(ki.rr)+'，建议加强宽带业务发展。'});
if(u.xb>=500)analyses.push({t:'good',m:'获得星级补贴<b>'+fmt(u.xb)+'元</b>，星级评定良好。'});
for(var a=0;a<analyses.length;a++){var an=analyses[a];html+='<div class="analysis-box a-'+an.t+'">'+an.m+'</div>';}
html+='</div>';

// === 薪酬明细表（只有实发，无预发）===
html+='<div class="section"><h3>薪酬明细表</h3>';
html+='<table class="detail-table"><thead><tr><th>项目</th><th>5月实发金额</th></tr></thead><tbody>';
var rows=[['基薪含保障',u.sj],['保障费(个+企)',u.bz],['KPI得分(百分制)',u.ks],['KPI实际发放',u.kf],['新星级补贴',u.xb],['激励/补贴',u.jl],['补充激励',u.bc],['5月申诉',u.sq],['保底机卡考核',u.bd],['合同考核',u.ht],['缺勤扣减',u.kc],['员工实发',u.sf],['5月酬金',u.cj],['5月清算',u.qs],['个人保障费',u.gr],['个税扣除',u.gs],['大病和补充',u.db],['技术服务费合计',u.zj]];
for(var ri=0;ri<rows.length;ri++){var r=rows[ri];var cls=r[1]<0?'tag-down':'';html+='<tr><td>'+r[0]+'</td><td class="'+cls+'">'+fmt(r[1])+'</td></tr>';}
html+='</tbody></table></div>';

html+='<div style="text-align:center;padding:16px;font-size:11px;color:#bbb">数据每月更新 | 仅供个人查询 | 如有疑问请联系管理员</div>';

c.innerHTML=html;}
</script>
</body>
</html>
