<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>通服公司员工薪酬分析 - 2026年4月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333;font-size:14px;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
.login-card{background:#fff;border-radius:16px;padding:40px 48px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .logo{text-align:center;margin-bottom:32px}
.login-card .logo h1{font-size:22px;color:#1a1a2e;font-weight:700}
.login-card .logo p{font-size:13px;color:#8c8c9a;margin-top:4px}
.login-card .logo .icon{width:56px;height:56px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#0f3460}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0f3460,#1a1a2e);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-err{color:#ef4444;font-size:12px;text-align:center;margin-top:12px;display:none}
.app{display:none}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .icon-sm{width:32px;height:32px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:bold}
.topbar .brand h2{font-size:16px;color:#1a1a2e}
.topbar .user-info{font-size:13px;color:#666;display:flex;align-items:center;gap:12px}
.topbar .logout-btn{background:none;border:1px solid #ddd;color:#666;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.topbar .logout-btn:hover{background:#f5f5f5}
.container{max-width:960px;margin:0 auto;padding:20px 24px}
.card-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#8c8c9a;margin-bottom:6px}
.card .value{font-size:26px;font-weight:700;color:#1a1a2e}
.card .value.accent{color:#0f3460}
.card .value.up{color:#10b981}
.card .value.down{color:#ef4444}
.card .sub{font-size:11px;margin-top:4px;color:#8c8c9a}
.section{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.section h3{font-size:15px;color:#1a1a2e;margin-bottom:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section h3::before{content:'';width:4px;height:18px;background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:2px}
.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bar-item .bl{width:100px;text-align:right;color:#8c8c9a;flex-shrink:0}
.bar-item .bb{flex:1;height:24px;background:#f0f0f5;border-radius:6px;overflow:hidden;position:relative}
.bar-item .bf{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600;min-width:30px;transition:width .6s}
.detail-table{width:100%;border-collapse:collapse;font-size:13px}
.detail-table th{background:#f8f9fc;color:#555;padding:10px 12px;text-align:center;font-weight:600;border-bottom:2px solid #e5e7eb;white-space:nowrap}
.detail-table td{padding:10px 12px;text-align:center;border-bottom:1px solid #f0f0f5;white-space:nowrap}
.detail-table tr:hover td{background:#fafbff}
.tag-up{color:#10b981;font-weight:600}
.tag-down{color:#ef4444;font-weight:600}
/* KPI grid - 2 columns like 薪酬查询系统 */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi-item{border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.kpi-item .ki-left{display:flex;flex-direction:column;gap:4px;flex:1}
.kpi-item .ki-name{font-size:13px;color:#555}
.kpi-item .ki-weight{font-size:11px;color:#aaa}
.kpi-item .ki-bar{width:100%;height:6px;background:#f0f0f5;border-radius:3px}
.kpi-item .ki-fill{height:100%;border-radius:3px;transition:width .6s}
.kpi-item .ki-score{font-size:18px;font-weight:700;flex-shrink:0;margin-left:12px}
.analysis-box{background:#f8f9fc;border-radius:10px;padding:14px 18px;margin-bottom:8px;font-size:13px;line-height:1.7}
.analysis-box.a-good{border-left:4px solid #10b981}
.analysis-box.a-bad{border-left:4px solid #ef4444}
.analysis-box.a-info{border-left:4px solid #0f3460}
.analysis-box b{color:#1a1a2e}
.settle-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.settle-card{background:#f8f9fc;border-radius:8px;padding:14px;text-align:center}
.settle-card .sl{font-size:11px;color:#8c8c9a;margin-bottom:4px}
.settle-card .sv{font-size:18px;font-weight:700;color:#1a1a2e}
/* 酬金对比条 */
.cj-compare{margin-top:8px}
.cj-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.cj-bar-wrap .cb-label{width:60px;text-align:right;color:#8c8c9a;flex-shrink:0}
.cj-bar-wrap .cb-track{flex:1;height:20px;background:#f0f0f5;border-radius:5px;overflow:hidden}
.cj-bar-wrap .cb-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff;font-weight:600;min-width:30px}
.cj-bar-wrap .cb-val{width:90px;flex-shrink:0;color:#555;font-size:11px}
@media(max-width:640px){.card-row{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:1fr}.settle-box{grid-template-columns:1fr}}
</style>
</head>

if(u.cj>=t.avg_cj*1.2)analyses.push({t:'good',m:'4月酬金<b>'+fmt(u.cj)+'元</b>，高于全员均值20%以上，业务拓展能力强。'});
else if(u.cj<t.avg_cj*0.8)analyses.push({t:'bad',m:'4月酬金<b>'+fmt(u.cj)+'元</b>，低于全员均值，建议加大业务拓展力度。'});
else analyses.push({t:'info',m:'4月酬金<b>'+fmt(u.cj)+'元</b>，处于全员中等水平。'});
if(ki.jr<0.6)analyses.push({t:'bad',m:'积分完成率仅'+pct(ki.jr)+'，是拉低KPI的主要因素。'});
if(ki.rr<0.5)analyses.push({t:'bad',m:'融合宽带完成率'+pct(ki.rr)+'，建议加强宽带业务发展。'});

for(var a=0;a<analyses.length;a++){var an=analyses[a];html+='<div class="analysis-box a-'+an.t+'">'+an.m+'</div>';}
